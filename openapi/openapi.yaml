openapi: 3.0.3
info:
  title: OpsVision API
  version: 1.0.0
  description: |
    The OpsVision HTTP API. This file is the single source of truth for the
    wire contract: Go server types and interfaces are generated from it
    (`make gen`), and the TypeScript client is generated from it as well.

    All paths are served under the `/v1` base path. The tenant is taken from
    the bearer token (JWT); no endpoint accepts a tenant ID.

    JSON field names mirror the domain model. Periods are strings such as
    `2026-M10`, `2026-Q3`, `2026-H2`, or `2026-FY`.

    Required arrays and objects in responses are never null: an empty list
    is `[]` and an empty map is `{}`. Only fields marked `nullable` (for
    example a data value) can be null.
servers:
  - url: /v1
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Operator
  - name: Members
  - name: Org
  - name: Items
  - name: Scorecards
  - name: Methodology
  - name: Data
  - name: Imports
  - name: Records
  - name: Audit

paths:
  /me:
    get:
      operationId: getMe
      tags: [Identity]
      summary: Current user, active tenant, and accessible tenants
      responses:
        '200':
          description: The caller's identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/layouts/{sc}:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: getMyLayout
      tags: [Scorecards]
      summary: Layout for the current user and scorecard
      responses:
        '200':
          description: The effective layout for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putMyLayout
      tags: [Scorecards]
      summary: Save the current user's layout for a scorecard
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutLayoutRequest' }
      responses:
        '200':
          description: The stored layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /operator/tenants:
    get:
      operationId: listOperatorTenants
      tags: [Operator]
      summary: List all tenants (operator only)
      responses:
        '200':
          description: All tenants
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOperatorTenant
      tags: [Operator]
      summary: Create a tenant and its first admin (operator only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: The created tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members:
    get:
      operationId: listMembers
      tags: [Members]
      summary: List the tenant's members
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: { $ref: '#/components/schemas/Membership' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: inviteMember
      tags: [Members]
      summary: Invite a member by email (admin only)
      description: >
        Creates a pending membership keyed `pending:` plus the lowercased
        email. It is bound to the person's user ID when they first sign in
        with that (verified) email.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteMemberRequest' }
      responses:
        '201':
          description: The pending membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /members/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateMember
      tags: [Members]
      summary: Change a member's role and scope (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRequest' }
      responses:
        '200':
          description: The updated membership
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org/levels:
    get:
      operationId: listOrgLevels
      tags: [Org]
      summary: List org hierarchy levels
      responses:
        '200':
          description: Levels, shallowest first
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: putOrgLevels
      tags: [Org]
      summary: Replace the org hierarchy levels (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [levels]
              properties:
                levels:
                  type: array
                  items: { $ref: '#/components/schemas/Level' }
      responses:
        '200':
          description: The stored levels
          content:
            application/json:
              schema:
                type: object
                required: [levels]
                properties:
                  levels:
                    type: array
                    items: { $ref: '#/components/schemas/Level' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/units:
    get:
      operationId: listOrgUnits
      tags: [Org]
      summary: List org units
      responses:
        '200':
          description: Org units
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units:
                    type: array
                    items: { $ref: '#/components/schemas/OrgUnit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createOrgUnit
      tags: [Org]
      summary: Create an org unit (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgUnit' }
      responses:
        '201':
          description: The created org unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgUnit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/units/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateOrgUnit
      tags: [Org]
      summary: Rename, re-key, change the level of, or retire an org unit (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOrgUnitRequest' }
      responses:
        '200':
          description: The updated org unit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgUnit' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /org/units/{id}/moves:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      operationId: createOrgMove
      tags: [Org]
      summary: Reparent an org unit effective from a month (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrgMoveRequest' }
      responses:
        '201':
          description: The recorded move
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgMove' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /org/tree:
    get:
      operationId: getOrgTree
      tags: [Org]
      summary: The org tree as it stood in a month
      parameters:
        - name: month
          in: query
          required: false
          description: Month to show; defaults to the current month.
          schema: { $ref: '#/components/schemas/MonthPeriod' }
      responses:
        '200':
          description: The org tree
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgTree' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /item-kinds:
    get:
      operationId: listItemKinds
      tags: [Items]
      summary: List item kinds
      responses:
        '200':
          description: Item kinds
          content:
            application/json:
              schema:
                type: object
                required: [itemKinds]
                properties:
                  itemKinds:
                    type: array
                    items: { $ref: '#/components/schemas/ItemKind' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createItemKind
      tags: [Items]
      summary: Create an item kind (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemKind' }
      responses:
        '201':
          description: The created item kind
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemKind' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /items:
    get:
      operationId: listItems
      tags: [Items]
      summary: List tracked items
      parameters:
        - name: kind
          in: query
          required: false
          description: Only items of this kind.
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Tracked items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TrackedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createItem
      tags: [Items]
      summary: Create a tracked item (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackedItem' }
      responses:
        '201':
          description: The created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /items/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: updateItem
      tags: [Items]
      summary: Update a tracked item (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: The updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TrackedItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards:
    get:
      operationId: listScorecards
      tags: [Scorecards]
      summary: List scorecards
      responses:
        '200':
          description: Scorecards
          content:
            application/json:
              schema:
                type: object
                required: [scorecards]
                properties:
                  scorecards:
                    type: array
                    items: { $ref: '#/components/schemas/Scorecard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: createScorecard
      tags: [Scorecards]
      summary: Create a scorecard (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Scorecard' }
      responses:
        '201':
          description: The created scorecard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/default-layout:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    put:
      operationId: putDefaultLayout
      tags: [Scorecards]
      summary: Save the tenant default layout (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutLayoutRequest' }
      responses:
        '200':
          description: The stored default layout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/reports:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: listReportMonths
      tags: [Scorecards]
      summary: List report months and their publish status
      responses:
        '200':
          description: Months in the report history window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportMonthList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/reports/{period}/summary:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/Period'
    get:
      operationId: getReportSummary
      tags: [Scorecards]
      summary: Executive summary for a report month
      responses:
        '200':
          description: The stored summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putReportSummary
      tags: [Scorecards]
      summary: Save the executive summary (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutReportSummaryRequest' }
      responses:
        '200':
          description: The stored summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/reports/{period}/publish:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/Period'
    post:
      operationId: publishReport
      tags: [Scorecards]
      summary: Publish a monthly operating report (admin only)
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishReportRequest' }
      responses:
        '200':
          description: The new revision number
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishReportResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/reports/{period}:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/Period'
    get:
      operationId: getReportDocument
      tags: [Scorecards]
      summary: Live or published report document
      parameters:
        - name: revision
          in: query
          required: false
          description: |
            Omit for the latest published snapshot if any, otherwise live.
            `live` always recomputes. A positive integer returns that revision.
          schema:
            type: string
      responses:
        '200':
          description: The report document
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportDocument' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/versions:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: listVersions
      tags: [Methodology]
      summary: List a scorecard's methodology versions
      responses:
        '200':
          description: Versions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/MethodologyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createVersion
      tags: [Methodology]
      summary: Create a draft methodology version, optionally cloned (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVersionRequest' }
      responses:
        '201':
          description: The created draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MethodologyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/versions/{v}:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersion
      tags: [Methodology]
      summary: Get one methodology version
      responses:
        '200':
          description: The version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MethodologyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: putVersion
      tags: [Methodology]
      summary: Save a draft version's content (admin only)
      description: |
        Only drafts can be saved. `revision` must equal the stored revision;
        otherwise the call fails with 409 `conflict`. Content is stored as
        sent; use the validate operation to check it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutVersionRequest' }
      responses:
        '200':
          description: The saved version, with its new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MethodologyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/versions/{v}/validate:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: validateVersion
      tags: [Methodology]
      summary: Validate a version's content (admin only)
      description: |
        Always 200 for an existing version. `valid` is false when the content
        has problems, and `errors` lists every one as `{path, message}`; it is
        empty when `valid` is true. Validation uses the tenant's status scale,
        and checks derive rules against the tenant's record types: each
        `where` must compile (problems at `measures[i].derive.where`).
      responses:
        '200':
          description: The validation result
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors]
                properties:
                  valid: { type: boolean }
                  errors:
                    type: array
                    items: { $ref: '#/components/schemas/ErrorDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/versions/{v}/publish:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/VersionId'
    post:
      operationId: publishVersion
      tags: [Methodology]
      summary: Publish a draft, effective from a period (admin only)
      description: |
        Validates first; invalid content fails with 400 `invalid` and
        `error.details` lists every problem as `{path, message}`, including
        derive rules that do not fit the tenant's record types (at
        `measures[i].derive...`). After publishing, derived values of open
        periods are recalculated from the stored records under the versions
        now in force; `recalculated` counts the data points written or
        removed. If recalculation fails the publish still stands:
        `recalculationError` says so, and the next records upload or publish
        recalculates again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishVersionRequest' }
      responses:
        '200':
          description: The published version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishVersionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /scorecards/{sc}/versions/{v}/diff:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
      - $ref: '#/components/parameters/VersionId'
    get:
      operationId: getVersionDiff
      tags: [Methodology]
      summary: Compare a version against another version
      parameters:
        - name: against
          in: query
          required: false
          description: |
            ID of the version to compare against; it must belong to the same
            scorecard. Defaults to the published version currently in force
            (the one with the latest effective period).
          schema: { $ref: '#/components/schemas/ServerId' }
      responses:
        '200':
          description: The differences, from `against` to this version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VersionDiff' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/view:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: getScorecardView
      tags: [Scorecards]
      summary: Compute the scorecard table
      description: |
        Columns are `periods` (any grain) followed by `ytd` (fiscal
        year-to-date, each given by the month it runs through).
      parameters:
        - name: periods
          in: query
          required: false
          description: |
            Period columns, of any grain. At most 24. At least one column
            is required across `periods` and `ytd`; the server returns 400
            `invalid` for an empty request or one over the limits.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 24
            items: { $ref: '#/components/schemas/Period' }
        - name: ytd
          in: query
          required: false
          description: |
            Months that fiscal year-to-date columns run through. At most 2.
            Counts toward the at-least-one-column rule with `periods`.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 2
            items: { $ref: '#/components/schemas/MonthPeriod' }
        - name: subjects
          in: query
          required: false
          description: Keep only rows for these subject IDs. At most 200.
          style: form
          explode: true
          schema:
            type: array
            maxItems: 200
            items: { $ref: '#/components/schemas/Id' }
        - name: restate
          in: query
          required: false
          description: |
            Methodology version ID (any status) to compute every column
            under. Omit for the version in force in each column.
          schema: { $ref: '#/components/schemas/ServerId' }
        - name: structure
          in: query
          required: false
          description: |
            `as_of` (default) shows each period under that period's org
            structure; `current` shows all periods under the latest
            structure.
          schema:
            type: string
            enum: [as_of, current]
      responses:
        '200':
          description: The scorecard view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScorecardView' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/entry:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: getDataEntry
      tags: [Data]
      summary: The data-entry grid for one period
      parameters:
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
      responses:
        '200':
          description: Entry rows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryGrid' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/data:batch:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    post:
      operationId: batchSaveData
      tags: [Data]
      summary: Save data points, all or nothing
      description: |
        Each write carries the revision the client last saw. If any write is
        stale, nothing is saved and the response is 409 with the conflicting
        writes and the current stored data points.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataBatchRequest' }
      responses:
        '200':
          description: The saved data points, with their new revisions
          content:
            application/json:
              schema:
                type: object
                required: [saved]
                properties:
                  saved:
                    type: array
                    items: { $ref: '#/components/schemas/DataPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: One or more writes were based on a stale revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataBatchConflicts' }

  /scorecards/{sc}/preview:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    post:
      operationId: previewData
      tags: [Data]
      summary: Compute the cells a batch would affect, without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DataBatchRequest' }
      responses:
        '200':
          description: The affected cells
          content:
            application/json:
              schema:
                type: object
                required: [cells]
                properties:
                  cells:
                    type: array
                    items: { $ref: '#/components/schemas/Cell' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/history:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: getDataHistory
      tags: [Data]
      summary: Revision history of one data point
      parameters:
        - name: measure
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Key' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
      responses:
        '200':
          description: Stored revisions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [history]
                properties:
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/DataPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/overrides:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    put:
      operationId: putOverride
      tags: [Data]
      summary: Create or replace an override on a metric cell
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutOverrideRequest' }
      responses:
        '200':
          description: The stored override
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Override' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteOverride
      tags: [Data]
      summary: Remove an override from a metric cell
      description: The cell is identified by query parameters; DELETE has no body.
      parameters:
        - name: metricKey
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Key' }
        - name: subjectId
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
      responses:
        '204':
          description: The override was removed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /imports/uploads:
    post:
      operationId: createImportUpload
      tags: [Imports]
      summary: Start an import and get a URL to upload the file to
      description: |
        `contentType` is the .xlsx type (the default) or `text/csv`; the
        upload URL accepts that type only. Admins only.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filename: { type: string }
                contentType: { type: string }
      responses:
        '201':
          description: The import and its upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportUpload' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /imports/{id}/parse:
    parameters:
      - $ref: '#/components/parameters/ServerIdPath'
    post:
      operationId: parseImport
      tags: [Imports]
      summary: Parse an uploaded file into a change set preview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParseImportRequest' }
      responses:
        '200':
          description: The parsed change set; nothing has been applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSetPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /imports/{id}/inspect:
    parameters:
      - $ref: '#/components/parameters/ServerIdPath'
    post:
      operationId: inspectImport
      tags: [Records]
      summary: Look at an uploaded records export (admin only)
      description: |
        Guesses each column's record field, lists the distinct values of
        priority, state, and product or team columns, detects date formats,
        suggests a record type, recognizes a saved `records` template, and
        suggests the org unit or tracked item each product or team value
        means. Nothing is stored. CSV files are read with the header on line
        1, workbooks from the first visible sheet.
      responses:
        '200':
          description: What the file looks like
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordsInspectResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /imports/{id}/records-preview:
    parameters:
      - $ref: '#/components/parameters/ServerIdPath'
    post:
      operationId: previewRecordsImport
      tags: [Records]
      summary: Preview importing an uploaded records export (admin only)
      description: |
        Reads the upload with a saved `records` template (`templateId`) or an
        inline one (`template`); exactly one is required. Returns the row
        counts, what changes on the scorecard, and what needs the admin's
        input. Nothing is applied: the preview and its answers are stored on
        the import (status `parsed`, profile `records`) for apply. An import
        may be previewed again until it is applied. `draftVersionId`
        evaluates a draft methodology version in place of the versions in
        force. `missing` lists the open records a full export no longer has.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordsPreviewRequest' }
      responses:
        '200':
          description: The preview; nothing has been applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordsPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/TooLarge' }

  /imports/{id}/apply:
    parameters:
      - $ref: '#/components/parameters/ServerIdPath'
    post:
      operationId: applyImport
      tags: [Imports]
      summary: Apply a parsed change set or a records preview (admin only)
      description: |
        A `legacy_workbook` import ignores the body. A `records` import needs
        the answers of its stored preview: different answers fail with 409
        "preview is out of date". It stores the snapshot, the records, and
        the answered source keys and shared units, then recalculates derived
        values; `saveTemplate` also saves the template with the answered
        value maps and date order. The response's `records` describes what
        was applied. An import can be applied once. Derived values are
        recalculated for every scorecard of the tenant, since records belong
        to the tenant; `answers.useRecords` names cells of the previewed one.

        A records 409 carries one of these codes: `already_applied` (this
        preview was applied already), `preview_out_of_date` (the plan or the
        answers are not the stored preview's, the preview is missing, or an
        answered source key now belongs to another subject: preview again),
        or `conflict` (a record type or template changed meanwhile: try
        again).
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyImportRequest' }
      responses:
        '200':
          description: The applied change set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeSetPreview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /record-types:
    get:
      operationId: listRecordTypes
      tags: [Records]
      summary: List the tenant's record types
      responses:
        '200':
          description: Record types, sorted by ID
          content:
            application/json:
              schema:
                type: object
                required: [recordTypes]
                properties:
                  recordTypes:
                    type: array
                    items: { $ref: '#/components/schemas/RecordType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /record-types/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordTypeId'
    put:
      operationId: putRecordType
      tags: [Records]
      summary: Create or replace a record type (admin only)
      description: |
        `revision` is the revision the client loaded: 0 creates the type,
        which must not exist yet. A stale revision fails with 409. Removing
        or renaming a priority or attribute, or changing an attribute's type,
        that a derive rule of any methodology version uses also fails with
        409, naming the measure and version; that 409 carries one detail, at
        `priorities` or `attributes`, which a stale revision's does not.
        Adding priorities and attributes is always allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordType' }
      responses:
        '200':
          description: The stored record type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /record-types/{id}/values:
    parameters:
      - $ref: '#/components/parameters/RecordTypeId'
    get:
      operationId: listRecordValues
      tags: [Records]
      summary: The values stored records hold in one field (admin only)
      description: |
        Up to 100 distinct non-empty values of `field` (a record field or an
        attribute key of the type) across the stored records of the type,
        each record as of its latest revision, most common first and ties by
        value. Numbers, yes/no values and dates are written as text
        (`12.5`, `true`, `2026-09-03`). An unknown record type is 404; an
        unknown field is 400 at `field`.
      parameters:
        - name: field
          in: query
          required: true
          description: A record field or attribute key, such as `category` or `customerTicket`.
          schema: { type: string }
      responses:
        '200':
          description: The values, most common first
          content:
            application/json:
              schema:
                type: object
                required: [values]
                properties:
                  values:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/RecordValueCount' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/records/sample:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    post:
      operationId: sampleRecords
      tags: [Records]
      summary: Count the records a condition matches in a period (admin only)
      description: |
        Counts, per org unit or tracked item, the stored records of
        `recordType` whose `bucketBy` date falls in `period` and that match
        `where` (each record as of its latest revision). Records whose
        product or team matches no single leaf subject are not counted. A
        `where` that does not compile fails with 400 at `where`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordsSampleRequest' }
      responses:
        '200':
          description: The counts, largest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordsSample' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /scorecards/{sc}/records/contributions:
    parameters:
      - $ref: '#/components/parameters/ScorecardId'
    get:
      operationId: listRecordContributions
      tags: [Records]
      summary: The records behind a metric cell
      description: |
        For each derived measure the metric's formula references (under the
        version in force for the period), the stored data point beside the
        value records give, and the records that contribute to it. A
        rolled-up subject lists the contributions of every leaf subject below
        it that the caller may read. Requires data read access to the
        subject. Records are paginated across measures, 100 per page; pass
        `nextCursor` back as `cursor` for the next page.
      parameters:
        - name: metric
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Key' }
        - name: subject
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Id' }
        - name: period
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Period' }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The contributions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordContributions' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /import-templates:
    get:
      operationId: listImportTemplates
      tags: [Imports]
      summary: List import templates
      responses:
        '200':
          description: Import templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/ImportTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      operationId: replaceImportTemplates
      tags: [Imports]
      summary: Replace all import templates (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templates]
              properties:
                templates:
                  type: array
                  items: { $ref: '#/components/schemas/ImportTemplate' }
      responses:
        '200':
          description: The stored templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items: { $ref: '#/components/schemas/ImportTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /import-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      operationId: putImportTemplate
      tags: [Imports]
      summary: Create or replace one import template (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportTemplate' }
      responses:
        '200':
          description: The stored template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /audit:
    get:
      operationId: listAudit
      tags: [Audit]
      summary: List audit entries in a time range
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range, inclusive (RFC 3339).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: End of the range, exclusive (RFC 3339). At most 31 days after `from`.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Client-supplied identifier.
      schema: { $ref: '#/components/schemas/Id' }
    ServerIdPath:
      name: id
      in: path
      required: true
      description: Server-generated identifier.
      schema: { $ref: '#/components/schemas/ServerId' }
    UserId:
      name: userId
      in: path
      required: true
      description: User ID from the identity provider. It never contains `#`.
      schema: { $ref: '#/components/schemas/UserId' }
    ScorecardId:
      name: sc
      in: path
      required: true
      description: Scorecard ID.
      schema: { $ref: '#/components/schemas/Id' }
    VersionId:
      name: v
      in: path
      required: true
      description: Methodology version ID.
      schema: { $ref: '#/components/schemas/ServerId' }
    RecordTypeId:
      name: id
      in: path
      required: true
      description: Record type ID.
      schema: { $ref: '#/components/schemas/Key' }
    Period:
      name: period
      in: path
      required: true
      description: Reporting period string such as 2026-M10.
      schema: { $ref: '#/components/schemas/Period' }

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`invalid`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid bearer token (`unauthorized`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's role or scope does not allow this (`forbidden`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource does not exist (`not_found`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The request conflicts with current state (`conflict`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooLarge:
      description: The uploaded file is over the 20 MiB limit (`too_large`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---- Errors -----------------------------------------------------------
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [not_found, forbidden, conflict, invalid, unauthorized, not_implemented, too_large, already_applied, preview_out_of_date]
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
    ErrorDetail:
      type: object
      description: One validation problem. `path` looks like `metrics[0].formula`.
      required: [path, message]
      properties:
        path: { type: string }
        message: { type: string }

    # ---- Scalars ----------------------------------------------------------
    Id:
      type: string
      description: Client-supplied identifier.
      pattern: '^[A-Za-z0-9_-]{1,64}$'
      example: team-alpha
    ServerId:
      type: string
      description: Server-generated identifier; treat as opaque.
      minLength: 1
      example: 01J9ZQ3K8W
    UserId:
      type: string
      description: User ID from the identity provider. It never contains `#`.
      minLength: 1
      example: auth0|abc123
    Key:
      type: string
      description: Measure or metric key.
      pattern: '^[a-z][a-z0-9_]*$'
      example: open_defects
    Period:
      type: string
      description: A month, quarter, half, or fiscal year.
      pattern: '^\d{4}-(M(0[1-9]|1[0-2])|Q[1-4]|H[12]|FY)$'
      example: 2026-M10
    Date:
      type: string
      format: date
      description: A calendar date; time zones are ignored.
      example: '2026-09-03'
    MonthPeriod:
      type: string
      description: A month.
      pattern: '^\d{4}-M(0[1-9]|1[0-2])$'
      example: 2026-M10
    OptionalPeriod:
      type: string
      description: A period, or the empty string when unset.
      pattern: '^(\d{4}-(M(0[1-9]|1[0-2])|Q[1-4]|H[12]|FY))?$'
      example: 2026-M10
    Role:
      type: string
      enum: [admin, contributor, viewer]
    MeasureValue:
      type: number
      format: double
      nullable: true
      description: The value, or null when not applicable.

    # ---- Identity and tenants --------------------------------------------
    Scope:
      type: object
      description: Restricts what a membership can see or edit. An empty list means everything.
      required: [orgUnitIds, metricKeys]
      properties:
        orgUnitIds:
          type: array
          items: { $ref: '#/components/schemas/Id' }
        metricKeys:
          type: array
          items: { $ref: '#/components/schemas/Key' }
    StatusLevel:
      type: object
      description: One level of a tenant's status scale. A higher rank is worse.
      required: [key, label, color, rank]
      properties:
        key: { type: string, example: G }
        label: { type: string, example: Green }
        color: { type: string, example: '#137A3A' }
        rank: { type: integer }
    Tenant:
      type: object
      required: [id, name, auth0OrgId, fiscalYearStartMonth, statusScale, defaultRole, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ServerId' }
        name: { type: string }
        auth0OrgId: { type: string }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        statusScale:
          type: array
          items: { $ref: '#/components/schemas/StatusLevel' }
        defaultRole: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }
    TenantSummary:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/ServerId' }
        name: { type: string }
    Me:
      type: object
      required: [userId, name, email, isOperator, tenants]
      properties:
        userId: { $ref: '#/components/schemas/UserId' }
        name: { type: string }
        email: { type: string }
        isOperator: { type: boolean }
        tenant:
          description: The active tenant, when the token names one.
          allOf:
            - $ref: '#/components/schemas/Tenant'
        role: { $ref: '#/components/schemas/Role' }
        scope: { $ref: '#/components/schemas/Scope' }
        tenants:
          type: array
          items: { $ref: '#/components/schemas/TenantSummary' }
    CreateTenantRequest:
      type: object
      required: [name, auth0OrgId, fiscalYearStartMonth, adminEmail]
      properties:
        name: { type: string, minLength: 1 }
        auth0OrgId: { type: string, minLength: 1 }
        fiscalYearStartMonth: { type: integer, minimum: 1, maximum: 12 }
        adminEmail: { type: string, minLength: 1, example: admin@example.com }
    Membership:
      type: object
      required: [userId, email, name, role, scope, createdAt]
      properties:
        userId: { $ref: '#/components/schemas/UserId' }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        scope: { $ref: '#/components/schemas/Scope' }
        createdAt: { type: string, format: date-time }
    InviteMemberRequest:
      type: object
      required: [email, role, scope]
      properties:
        email: { type: string, minLength: 3 }
        role: { $ref: '#/components/schemas/Role' }
        scope: { $ref: '#/components/schemas/Scope' }
    UpdateMemberRequest:
      type: object
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/Role' }
        scope: { $ref: '#/components/schemas/Scope' }

    # ---- Org --------------------------------------------------------------
    Level:
      type: object
      description: One tier of the org hierarchy. Depth 0 is the root tier.
      required: [id, name, depth]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        depth: { type: integer, minimum: 0 }
    OrgUnit:
      type: object
      required: [id, name, levelId, parentId, sourceKeys]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        levelId: { $ref: '#/components/schemas/Id' }
        parentId:
          type: string
          description: Parent unit ID, or the empty string for a root.
          pattern: '^([A-Za-z0-9_-]{1,64})?$'
        sourceKeys:
          type: array
          description: Names this unit goes by in source systems, for imports.
          items: { type: string }
        retiredFrom:
          allOf:
            - $ref: '#/components/schemas/MonthPeriod'
    UpdateOrgUnitRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        levelId:
          description: |
            Move the unit to another level. Its level depth must stay strictly
            greater than its parent's and strictly less than its children's.
          allOf:
            - $ref: '#/components/schemas/Id'
        sourceKeys:
          type: array
          items: { type: string }
        retiredFrom:
          allOf:
            - $ref: '#/components/schemas/MonthPeriod'
    CreateOrgMoveRequest:
      type: object
      required: [newParentId, effectiveMonth]
      properties:
        newParentId: { $ref: '#/components/schemas/Id' }
        effectiveMonth: { $ref: '#/components/schemas/MonthPeriod' }
        note: { type: string }
    OrgMove:
      type: object
      required: [unitId, newParentId, effectiveMonth, note]
      properties:
        unitId: { $ref: '#/components/schemas/Id' }
        newParentId: { $ref: '#/components/schemas/Id' }
        effectiveMonth: { $ref: '#/components/schemas/MonthPeriod' }
        note: { type: string }
    OrgTreeNode:
      type: object
      required: [id, name, levelId, children]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        levelId: { $ref: '#/components/schemas/Id' }
        children:
          type: array
          items: { $ref: '#/components/schemas/OrgTreeNode' }
    OrgTree:
      type: object
      required: [month, roots]
      properties:
        month: { $ref: '#/components/schemas/MonthPeriod' }
        roots:
          type: array
          items: { $ref: '#/components/schemas/OrgTreeNode' }

    # ---- Items ------------------------------------------------------------
    ItemKind:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
    TrackedItem:
      type: object
      required: [id, kindId, name, orgUnitId, sourceKeys]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        kindId: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        orgUnitId:
          type: string
          description: The org unit this item belongs to, or the empty string when unattached.
          pattern: '^([A-Za-z0-9_-]{1,64})?$'
        sourceKeys:
          type: array
          items: { type: string }
    UpdateItemRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        orgUnitId:
          type: string
          pattern: '^([A-Za-z0-9_-]{1,64})?$'
        sourceKeys:
          type: array
          items: { type: string }

    # ---- Methodology ------------------------------------------------------
    Scorecard:
      type: object
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
    VersionStatus:
      type: string
      enum: [draft, in_review, published, superseded]
    Agg:
      type: string
      description: Aggregation across org units or across time.
      enum: [sum, min, max, latest, average, none]
    Direction:
      type: string
      enum: [higher_better, lower_better]
    Frequency:
      type: string
      enum: [monthly, quarterly, biannual, annual]
    MetricFormat:
      type: string
      enum: [percent0, percent1, percent2, number0, number1, number2, money_k, days0]
    RuleType:
      type: string
      enum: [bands, change, scale]
    Comparison:
      type: string
      enum: [prior_period, prior_year_average, baseline]
    Category:
      type: object
      required: [id, name, order]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        order: { type: integer }
    Measure:
      type: object
      required: [key, name, unit, orgAgg, timeAgg]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        unit: { type: string }
        orgAgg: { $ref: '#/components/schemas/Agg' }
        timeAgg: { $ref: '#/components/schemas/Agg' }
        source:
          type: string
          description: |
            Where values come from. `entered` (or absent) means typed or
            imported; `derived` means computed from records by `derive`.
          enum: [entered, derived]
        derive:
          $ref: '#/components/schemas/DeriveRule'
    DeriveRule:
      type: object
      description: |
        Turns records into a measure's value per subject per period. Required
        on `derived` measures and rejected on `entered` ones. Which other
        fields apply depends on `op`: `count`, `sum`, and `age_sum` need
        `bucketBy`; `sum` needs `field`; `age_sum` needs `ageFrom`;
        `commitments` needs `outcome`; `daily_open_weighted` needs a weight
        for every priority of the record type plus `none`.
      required: [recordType, op]
      properties:
        recordType: { $ref: '#/components/schemas/Id' }
        op:
          type: string
          enum: [count, sum, daily_open_weighted, commitments, days_in_period, age_sum]
        bucketBy:
          type: string
          description: A date field (`createdAt`, `committedAt`, `dueAt`, `completedAt`, `measuredAt`) or a date attribute key.
        field:
          type: string
          description: A number field or number attribute key (for `sum`).
        where:
          type: string
          description: A condition over record fields and attributes.
        outcome:
          type: string
          description: Which commitments count (for `commitments`).
          enum: [resolved, met]
        ageFrom:
          type: string
          description: Date field or date attribute key the age starts at.
        ageTo:
          type: string
          description: Date field or date attribute key the age ends at; empty means the period end.
        weights:
          type: object
          description: Weight per priority value, including `none` (for `daily_open_weighted`).
          additionalProperties: { type: number, format: double }
    AttributeDef:
      type: object
      description: A custom attribute of a record type.
      required: [key, name, type]
      properties:
        key:
          type: string
          description: Attribute key; camelCase or snake_case, starting with a lowercase letter.
          pattern: '^[a-z][A-Za-z0-9_]*$'
          example: customerTicket
        name: { type: string }
        type:
          type: string
          enum: [string, number, bool, date]
    RecordType:
      type: object
      description: |
        A tenant-level kind of record (defect, epic, ...). `none` is always an
        implicit priority. `trackedFrom` maps a record source to the first
        month derived values are produced for it.
      required: [id, name, priorities, attributes, trackedFrom, revision]
      properties:
        id: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        priorities:
          type: array
          items: { type: string }
        attributes:
          type: array
          items: { $ref: '#/components/schemas/AttributeDef' }
        trackedFrom:
          type: object
          additionalProperties: { $ref: '#/components/schemas/MonthPeriod' }
        revision: { type: integer, minimum: 0 }
    Subject:
      type: object
      description: What a metric is reported at. `kind` is `level` or `item_kind`.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [level, item_kind]
        id: { $ref: '#/components/schemas/Id' }
    Band:
      type: object
      description: |
        Maps a value range to a status. Bands are evaluated in order and the
        first match wins. `op` is one of `>=`, `>`, `<=`, `<`, or the empty
        string for the final else band.
      required: [status, op, value]
      properties:
        status: { type: string }
        op: { type: string }
        value: { type: number, format: double }
    SubjectBands:
      type: object
      required: [subjectId, bands]
      properties:
        subjectId: { $ref: '#/components/schemas/Id' }
        bands:
          type: array
          items: { $ref: '#/components/schemas/Band' }
    ScaleStep:
      type: object
      required: [status, min]
      properties:
        status: { type: string }
        min: { type: number, format: double }
    StatusRule:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/RuleType' }
        bands:
          type: array
          items: { $ref: '#/components/schemas/Band' }
        compare: { $ref: '#/components/schemas/Comparison' }
        perSubject:
          type: array
          items: { $ref: '#/components/schemas/SubjectBands' }
        scale:
          type: array
          items: { $ref: '#/components/schemas/ScaleStep' }
    Target:
      type: object
      required: [label, from, to, value, subjectId]
      properties:
        label: { type: string }
        from: { $ref: '#/components/schemas/OptionalPeriod' }
        to: { $ref: '#/components/schemas/OptionalPeriod' }
        value: { type: number, format: double }
        subjectId:
          type: string
          description: Subject the target applies to, or the empty string for all subjects.
    Metric:
      type: object
      required: [key, name, categoryId, formula, format, direction, frequency, reportedAt, rollItemsToOrg, rule, targets, definition, notes, example, source, link]
      properties:
        key: { $ref: '#/components/schemas/Key' }
        name: { type: string }
        categoryId: { $ref: '#/components/schemas/Id' }
        formula: { type: string, example: 'closed / total' }
        format: { $ref: '#/components/schemas/MetricFormat' }
        direction: { $ref: '#/components/schemas/Direction' }
        frequency: { $ref: '#/components/schemas/Frequency' }
        reportedAt:
          type: array
          items: { $ref: '#/components/schemas/Subject' }
        rollItemsToOrg: { type: boolean }
        rule: { $ref: '#/components/schemas/StatusRule' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/Target' }
        definition: { type: string }
        notes: { type: string }
        example: { type: string }
        source: { type: string }
        link: { type: string }
        chartKind:
          type: string
          description: |
            Chart presentation override. Empty means automatic. One of
            `ratio`, `money_plan`, `change`, `uptime`, `days`, `discrete`, `line`.
    Methodology:
      type: object
      required: [categories, measures, metrics]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        measures:
          type: array
          items: { $ref: '#/components/schemas/Measure' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/Metric' }
    MethodologyVersion:
      type: object
      required: [id, scorecardId, name, status, effectiveFrom, revision, content]
      properties:
        id: { $ref: '#/components/schemas/ServerId' }
        scorecardId: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        status: { $ref: '#/components/schemas/VersionStatus' }
        effectiveFrom: { $ref: '#/components/schemas/OptionalPeriod' }
        publishedAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 0 }
        content: { $ref: '#/components/schemas/Methodology' }
    CreateVersionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        cloneFrom:
          description: ID of a version whose content seeds the new draft.
          allOf:
            - $ref: '#/components/schemas/ServerId'
    PutVersionRequest:
      type: object
      required: [revision, content]
      properties:
        revision:
          type: integer
          minimum: 0
          description: The revision the client loaded. A mismatch fails with 409.
        name: { type: string, minLength: 1 }
        content: { $ref: '#/components/schemas/Methodology' }
    PublishVersionRequest:
      type: object
      required: [effectiveFrom]
      properties:
        effectiveFrom: { $ref: '#/components/schemas/Period' }
    PublishVersionResult:
      description: The published version, and how many derived data points publishing recalculated.
      allOf:
        - $ref: '#/components/schemas/MethodologyVersion'
        - type: object
          required: [recalculated]
          properties:
            recalculated: { type: integer, minimum: 0 }
            recalculationError:
              type: string
              description: Set only when the publish succeeded but recalculating derived values failed.
    VersionDiff:
      type: object
      required: [from, to, changes]
      properties:
        from: { $ref: '#/components/schemas/ServerId' }
        to: { $ref: '#/components/schemas/ServerId' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/VersionChange' }
    VersionChange:
      type: object
      required: [path, kind]
      properties:
        path:
          type: string
          example: metrics[2].formula
        kind:
          type: string
          enum: [added, removed, changed]
        before:
          description: The previous value; absent for added.
        after:
          description: The new value; absent for removed.

    # ---- Scorecard view ---------------------------------------------------
    Override:
      type: object
      description: Replaces a computed metric value and/or status, with a recorded reason.
      required: [metricKey, subjectId, period, value, status, reason, by, at]
      properties:
        metricKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        value: { $ref: '#/components/schemas/MeasureValue' }
        status:
          type: string
          description: Status key, or the empty string to keep the computed status.
        reason: { type: string }
        by: { $ref: '#/components/schemas/UserId' }
        at: { type: string, format: date-time }
    PutOverrideRequest:
      type: object
      required: [metricKey, subjectId, period]
      properties:
        metricKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        value: { $ref: '#/components/schemas/MeasureValue' }
        status: { type: string }
        reason: { type: string }
    CellComputed:
      type: object
      description: The value and status the engine computed, set only when an override applied.
      required: [value, status]
      properties:
        value: { $ref: '#/components/schemas/MeasureValue' }
        status: { type: string }
    Cell:
      type: object
      description: One metric's result for one subject and period.
      required: [metricKey, subjectId, period, ytd, value, display, status, naReason, components, coverage, change, changeKind, target, versionId]
      properties:
        metricKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        ytd:
          type: boolean
          description: True for a year-to-date cell; `period` is then the month it runs through.
        value:
          type: number
          format: double
          nullable: true
          description: Null when the cell is blank (missing input) or not applicable.
        display: { type: string, example: '94.5%' }
        status:
          type: string
          description: Status key, or the empty string when there is no outcome.
        naReason:
          type: string
          description: Set only for not-applicable cells.
        components:
          type: object
          description: |
            Rolled-up value of each measure the formula references. Always
            an object, never null: `{}` for blank or not-applicable cells.
          additionalProperties: { type: number, format: double }
        coverage:
          type: array
          description: '[slots with data, slots expected]'
          minItems: 2
          maxItems: 2
          items: { type: integer }
        change:
          type: number
          format: double
          nullable: true
        changeKind:
          type: string
          description: |
            How to read `change`: `improvement_pct` or `delta`; the empty
            string when there is none.
        target:
          type: number
          format: double
          nullable: true
        versionId:
          type: string
          description: The methodology version the cell was computed under; empty when none applied.
        override: { $ref: '#/components/schemas/Override' }
        computed: { $ref: '#/components/schemas/CellComputed' }
        rule:
          allOf: [{ $ref: '#/components/schemas/StatusRule' }]
          description: The rule after per-subject bands are applied. Omitted when no methodology version applied.
        cutoff:
          allOf: [{ $ref: '#/components/schemas/Date' }]
          description: |
            Set only on a month cell (not year to date) whose metric, under
            the version in force for the month, references a derived measure
            and whose records stop before the month ends: the as-of date of
            the earliest of the latest snapshots of those measures' record
            types. The cell is then month to date through this day.
    ViewRow:
      type: object
      description: One metric for one subject. `cells` has one entry per `periods` column, then one per `ytd` column.
      required: [metricKey, metricName, categoryId, subjectId, subjectName, format, depth, direction, frequency, chartKind, cells]
      properties:
        metricKey: { $ref: '#/components/schemas/Key' }
        metricName: { type: string }
        categoryId: { $ref: '#/components/schemas/Id' }
        subjectId: { $ref: '#/components/schemas/Id' }
        subjectName: { type: string }
        format: { $ref: '#/components/schemas/MetricFormat' }
        depth: { type: integer, minimum: 0 }
        direction: { $ref: '#/components/schemas/Direction' }
        frequency: { $ref: '#/components/schemas/Frequency' }
        chartKind: { type: string }
        definition: { type: string }
        cells:
          type: array
          items: { $ref: '#/components/schemas/Cell' }
    ScorecardView:
      type: object
      required: [periods, ytd, categories, rows, versionByPeriod]
      properties:
        periods:
          type: array
          items: { $ref: '#/components/schemas/Period' }
        ytd:
          type: array
          items: { $ref: '#/components/schemas/MonthPeriod' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/Category' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ViewRow' }
        versionByPeriod:
          type: object
          description: |
            Methodology version ID used for each column, keyed by the period
            string (`2026-M10`) or `YTD:<through>`. Columns with no version
            are omitted.
          additionalProperties: { $ref: '#/components/schemas/ServerId' }

    # ---- Data entry -------------------------------------------------------
    DataPoint:
      type: object
      description: A measure value for one subject in one period. A null value means not applicable.
      required: [measureKey, subjectId, period, value, naReason, source, enteredBy, enteredAt, revision]
      properties:
        measureKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        value: { $ref: '#/components/schemas/MeasureValue' }
        naReason: { type: string }
        source:
          type: string
          enum: [grid, import, api, sam, legacy, records]
        enteredBy: { $ref: '#/components/schemas/UserId' }
        enteredAt: { type: string, format: date-time }
        revision: { type: integer, minimum: 0 }
        deleted:
          type: boolean
          description: |
            Set only in history, on the revision that removed the value (a
            derived value no longer produced). Absent on live points.
    EntryRow:
      type: object
      required: [measureKey, measureName, metricKeys, subjectId, subjectName, period, naReason, revision, canEdit]
      properties:
        measureKey: { $ref: '#/components/schemas/Key' }
        measureName: { type: string }
        metricKeys:
          type: array
          description: Metrics that use this measure.
          items: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        subjectName: { type: string }
        period:
          description: |
            The period this row's data is for. It is the requested month for a
            monthly metric, or the quarter, half, or fiscal year that ends in
            the requested month for a coarser one. Send it back as the
            write's `period`.
          allOf:
            - $ref: '#/components/schemas/Period'
        value: { $ref: '#/components/schemas/MeasureValue' }
        naReason: { type: string }
        revision:
          type: integer
          minimum: 0
          description: Send back as `expectedRevision`. Zero when nothing is stored.
        canEdit:
          type: boolean
          description: |
            Whether the caller's role and scope allow editing this row. A
            derived row is editable by admins only.
        derived:
          type: boolean
          description: |
            The measure is derived from records in the version in force. Only
            set when true.
        source:
          type: string
          enum: [grid, import, api, sam, legacy, records]
          description: Where the stored value came from; absent when nothing is stored.
        recordsValue:
          type: number
          format: double
          description: |
            On a derived row whose stored value was typed: the value records
            give, when records cover the period.
    EntryGrid:
      type: object
      required: [period, rows]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/EntryRow' }
    DataWrite:
      type: object
      required: [measureKey, subjectId, period, expectedRevision]
      properties:
        measureKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        value: { $ref: '#/components/schemas/MeasureValue' }
        naReason:
          type: string
          description: Why the value is not applicable; used when `value` is null or absent.
        expectedRevision:
          type: integer
          minimum: 0
          description: The revision the client last saw; 0 for a new data point.
        clear:
          type: boolean
          description: |
            Admins only: delete the stored point instead of writing a value
            (send no value or naReason). On a derived measure the value
            records give then comes back at once.
    DataBatchRequest:
      type: object
      required: [writes]
      properties:
        writes:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/DataWrite' }
    DataConflict:
      type: object
      required: [write]
      properties:
        write: { $ref: '#/components/schemas/DataWrite' }
        current:
          description: The stored data point; absent when it no longer exists.
          allOf:
            - $ref: '#/components/schemas/DataPoint'
    DataBatchConflicts:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/DataConflict' }

    # ---- Imports ----------------------------------------------------------
    ImportUpload:
      type: object
      required: [importId, uploadUrl]
      properties:
        importId: { $ref: '#/components/schemas/ServerId' }
        uploadUrl:
          type: string
          description: Pre-signed URL to PUT the file to.
    ParseImportRequest:
      type: object
      required: [profile]
      properties:
        profile:
          type: string
          enum: [legacy_workbook, csv]
        templateId: { $ref: '#/components/schemas/Id' }
    ImportTemplate:
      type: object
      required: [id, name, profile, body]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, minLength: 1 }
        profile:
          type: string
          description: '`legacy_workbook` or `records`; `csv` is rejected.'
          enum: [legacy_workbook, csv, records]
        body:
          type: object
          description: >-
            The mapping document for the profile. For `legacy_workbook` it has
            `sheets`, `rows` and `methodology`, and an optional `scorecardId` naming the scorecard the import
            writes to (default: the tenant's only scorecard). For `records` it
            is a RecordTemplate for one of the tenant's record types. Unknown
            fields and invalid mappings are rejected with 400.
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
          readOnly: true
          description: Counts the saves that changed the template (1 after the first). Ignored on PUT.
        lastUsed:
          type: string
          format: date-time
          readOnly: true
          description: When an import last applied the template; absent if never. Ignored on PUT.
    RecordValueCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 1 }
    ImportCounts:
      type: object
      required: [dataPoints, overrides, versionText, legacyNotes]
      properties:
        dataPoints: { type: integer, minimum: 0 }
        overrides: { type: integer, minimum: 0 }
        versionText: { type: integer, minimum: 0 }
        legacyNotes: { type: integer, minimum: 0 }
    ImportFinding:
      type: object
      required: [severity, sheet, cell, message]
      properties:
        severity:
          type: string
          enum: [info, warn, error]
        sheet: { type: string }
        cell: { type: string, example: B7 }
        message: { type: string }
    ImportChange:
      type: object
      description: One change the import would make. Which fields are set depends on `kind`.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [data_point, override, version_text]
        measureKey: { $ref: '#/components/schemas/Key' }
        metricKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        value: { type: number, format: double }
        naReason: { type: string }
        status: { type: string }
        field: { type: string }
        text: { type: string }
    ChangeSetPreview:
      type: object
      required: [id, status, counts, findings, sample]
      properties:
        id: { $ref: '#/components/schemas/ServerId' }
        status:
          type: string
          enum: [parsed, applied]
        counts: { $ref: '#/components/schemas/ImportCounts' }
        findings:
          type: array
          items: { $ref: '#/components/schemas/ImportFinding' }
        sample:
          type: array
          maxItems: 50
          description: Up to 50 of the changes, for review.
          items: { $ref: '#/components/schemas/ImportChange' }
        records:
          description: Set only when a `records` import was applied; the other fields are then empty.
          allOf:
            - $ref: '#/components/schemas/RecordsApplied'

    # ---- Records ----------------------------------------------------------
    RecordFieldMap:
      type: object
      description: |
        Where one record field or attribute comes from: exactly one of
        `column` (header text), `constant`, and `template` (text with
        `{Column}` placeholders). `map` translates raw values (`*` is the
        fallback); `default` replaces an empty cell; `dateFormats` are Go
        layouts tried in order; `separator` splits a list column;
        `transform` (attributes only) is nonEmpty, number, bool, date, or text.
      properties:
        column: { type: string }
        constant: { type: string }
        template: { type: string }
        map:
          type: object
          additionalProperties: { type: string }
        default: { type: string }
        dateFormats:
          type: array
          items: { type: string }
        separator: { type: string }
        transform: { type: string }
    RecordFileSpec:
      type: object
      required: [format, headerRow]
      properties:
        format:
          type: string
          enum: [csv, xlsx]
        sheet:
          type: string
          description: Worksheet name; empty means the first visible sheet.
        headerRow:
          type: integer
          minimum: 0
          description: 1-based row holding the headers; 0 means 1.
    RecordSkipRule:
      type: object
      required: [column, in]
      properties:
        column: { type: string }
        in:
          type: array
          items: { type: string }
    RecordTemplate:
      type: object
      description: Maps one export format to one record type.
      required: [name, recordType, source, file, fullExport, fields]
      properties:
        name: { type: string }
        recordType: { $ref: '#/components/schemas/Key' }
        source:
          type: string
          description: The source system records come from (part of a record's identity).
        file: { $ref: '#/components/schemas/RecordFileSpec' }
        fullExport:
          type: boolean
          description: The file lists every record, so open records it lacks are missing.
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RecordFieldMap' }
        attributes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/RecordFieldMap' }
        skipRows:
          type: array
          items: { $ref: '#/components/schemas/RecordSkipRule' }
    RecordCellRef:
      type: object
      required: [measureKey, subjectId, period]
      properties:
        measureKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
    RecordAnswers:
      type: object
      description: |
        The admin's replies to a preview. `sourceKeys` maps a product or team
        value to the org unit or tracked item it means; `ignoreValues` skips
        rows carrying those values; `valueMaps` adds raw-value translations
        per template field or attribute; `dateOrder` settles ambiguous dates
        (`mdy`, `dmy`, or empty); `useRecords` lists typed values the derived
        value replaces; `markMissingCancelled` cancels records a full export
        no longer lists; `createShared` lists parent units that get a
        "<name> (shared)" child.
      properties:
        sourceKeys:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Id' }
        ignoreValues:
          type: array
          items: { type: string }
        valueMaps:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        dateOrder: { type: string }
        useRecords:
          type: array
          items: { $ref: '#/components/schemas/RecordCellRef' }
        markMissingCancelled: { type: boolean }
        createShared:
          type: array
          items: { $ref: '#/components/schemas/Id' }
    ColumnGuess:
      type: object
      required: [field, column, confidence, samples]
      properties:
        field: { type: string }
        column: { type: string }
        confidence: { type: number, format: double, minimum: 0, maximum: 1 }
        samples:
          type: array
          items: { type: string }
    ValueCount:
      type: object
      description: One distinct raw value, its row count, and its suggested meaning (empty for none).
      required: [value, count, suggested]
      properties:
        value: { type: string }
        count: { type: integer, minimum: 0 }
        suggested: { type: string }
    SubjectSuggestion:
      type: object
      description: |
        The org unit or tracked item one product or team value probably
        means: `subjectId` is the best match (empty when nothing is close),
        `score` its closeness from 0.5 to 1, `candidates` up to three matches.
      required: [value, rows, subjectId, score, candidates]
      properties:
        value: { type: string }
        rows: { type: integer, minimum: 0 }
        subjectId: { type: string }
        score: { type: number, format: double }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Id' }
    RecordInspection:
      type: object
      description: >-
        What an uploaded export looks like. `lastUploadAsOf` is the as-of date
        of the newest stored upload for the matched template's record type and
        source; it is absent when no template matched or nothing has been
        uploaded for them yet.
      required: [headers, rowCount, samples, suggestedType, guesses, values, dateFormats, ambiguousDates, draft, matchedTemplateId, added, missing]
      properties:
        headers:
          type: array
          items: { type: string }
        rowCount: { type: integer, minimum: 0 }
        samples:
          type: array
          description: The first rows of the file.
          items:
            type: array
            items: { type: string }
        suggestedType:
          type: string
          description: The record type the file probably holds; empty when none fits.
        guesses:
          type: array
          items: { $ref: '#/components/schemas/ColumnGuess' }
        values:
          type: object
          description: Distinct values by field (priority, state, subjectKey).
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/ValueCount' }
        dateFormats:
          type: object
          description: Go layouts that read each date column, by header.
          additionalProperties:
            type: array
            items: { type: string }
        ambiguousDates:
          type: array
          description: Columns where day-first and month-first both fit.
          items: { type: string }
        draft: { $ref: '#/components/schemas/RecordTemplate' }
        matchedTemplateId:
          type: string
          description: The saved template this file looks like; empty when none.
        added:
          type: array
          description: Columns of the file the matched template does not use.
          items: { type: string }
        missing:
          type: array
          description: Columns the matched template uses that the file lacks.
          items: { type: string }
        lastUploadAsOf: { $ref: '#/components/schemas/Date' }
    RecordsInspectResult:
      type: object
      required: [inspection, subjects]
      properties:
        inspection: { $ref: '#/components/schemas/RecordInspection' }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/SubjectSuggestion' }
    RecordsPreviewRequest:
      type: object
      required: [scorecardId, asOf]
      properties:
        scorecardId: { $ref: '#/components/schemas/Id' }
        asOf: { $ref: '#/components/schemas/Date' }
        templateId: { $ref: '#/components/schemas/Id' }
        template: { $ref: '#/components/schemas/RecordTemplate' }
        answers: { $ref: '#/components/schemas/RecordAnswers' }
        draftVersionId: { $ref: '#/components/schemas/ServerId' }
    RecordCounts:
      type: object
      description: Row counts; `missing` counts records.
      required: [new, changed, unchanged, skipped, missing, unmatched, errors]
      properties:
        new: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        missing: { type: integer, minimum: 0 }
        unmatched: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
    RecordContribution:
      type: object
      description: |
        One record's part in a derived value. `amount` is what it added (1
        for a count, a defect's points, an age in days); `dates` holds the
        dates the rule used, by field name; `subjectId` is the leaf subject
        it counts for, when listed for a cell.
      required: [source, externalId, title, url, priority, state, amount, reason, dates]
      properties:
        source: { type: string }
        externalId: { type: string }
        title: { type: string }
        url: { type: string }
        priority: { type: string }
        state:
          type: string
          enum: [open, done, cancelled]
        amount: { type: number, format: double }
        reason:
          type: string
          description: matched, met, missed, slipped, pending, open_days, or age_days.
        dates:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Date' }
        subjectId: { $ref: '#/components/schemas/Id' }
    RecordStoryLine:
      type: object
      description: |
        One metric cell an import changes. `reasons` lists, by reason
        (slipped, met, missed, newly_open, closed, priority_changed, added,
        removed), the records whose part in the cell changed.
      required: [period, metricKey, metricName, subjectId, subjectName, beforeDisplay, afterDisplay, beforeStatus, afterStatus, reasons]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        metricKey: { $ref: '#/components/schemas/Key' }
        metricName: { type: string }
        subjectId: { $ref: '#/components/schemas/Id' }
        subjectName: { type: string }
        beforeDisplay: { type: string }
        afterDisplay: { type: string }
        beforeStatus: { type: string }
        afterStatus: { type: string }
        reasons:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/RecordContribution' }
    TypedVsRecords:
      type: object
      description: A typed value of a derived measure beside the value records give.
      required: [measureKey, subjectId, period, typed, typedSource, records, contributions]
      properties:
        measureKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        typed: { type: number, format: double }
        typedSource: { type: string }
        records: { type: number, format: double }
        contributions:
          type: array
          items: { $ref: '#/components/schemas/RecordContribution' }
    RecordStory:
      type: object
      description: |
        What an import changes on the scorecard, worst status changes first;
        `more` counts lines beyond the first 50. `lockedWaiting` is empty
        until months can be locked.
      required: [nothingChanged, sameRecords, lines, more, typed, lockedWaiting, warnings]
      properties:
        nothingChanged:
          type: boolean
          description: True only when applying would change nothing, not even how far the data runs.
        sameRecords:
          type: boolean
          description: |
            The upload has no new or changed records, but its as-of date is
            later than `previousAsOf`, so applying moves how far the data runs.
        previousAsOf:
          description: The as-of date of the latest earlier upload from the same source, if any.
          allOf:
            - $ref: '#/components/schemas/Date'
        warnings:
          type: array
          description: |
            Plain-language notes on what derivation worked around (a priority
            with no weight counts as 0) or could not derive.
          items: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RecordStoryLine' }
        more: { type: integer, minimum: 0 }
        typed:
          type: array
          items: { $ref: '#/components/schemas/TypedVsRecords' }
        lockedWaiting:
          type: array
          items: { $ref: '#/components/schemas/RecordStoryLine' }
    RecordRowProblem:
      type: object
      description: One thing wrong with one row; `row` is 0 for a problem with the file's columns.
      required: [row, kind, column, field, value, message]
      properties:
        row: { type: integer, minimum: 0 }
        kind: { type: string }
        column: { type: string }
        field: { type: string }
        value: { type: string }
        message: { type: string }
    ParentMatch:
      type: object
      description: A product or team value that matches a parent unit, with its row count.
      required: [value, rows, unitId]
      properties:
        value: { type: string }
        rows: { type: integer, minimum: 0 }
        unitId: { $ref: '#/components/schemas/Id' }
    RecordsPreview:
      type: object
      required: [planId, counts, story, problems, unmatched, parents, newValues, missing, columnsAdded, columnsMissing]
      properties:
        planId:
          description: Identifies this preview's stored plan. Applying requires it, so only the preview on screen is applied.
          allOf:
            - $ref: '#/components/schemas/ServerId'
        counts: { $ref: '#/components/schemas/RecordCounts' }
        story: { $ref: '#/components/schemas/RecordStory' }
        problems:
          type: array
          items: { $ref: '#/components/schemas/RecordRowProblem' }
        unmatched:
          type: array
          items: { $ref: '#/components/schemas/SubjectSuggestion' }
        parents:
          type: array
          items: { $ref: '#/components/schemas/ParentMatch' }
        newValues:
          type: object
          description: Raw values no map covers, by field.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/ValueCount' }
        missing:
          type: array
          description: External IDs of open records a full export no longer has.
          items: { type: string }
        columnsAdded:
          type: array
          items: { type: string }
        columnsMissing:
          type: array
          items: { type: string }
    ApplyImportRequest:
      type: object
      properties:
        planId:
          description: Required for a records import, as the `planId` of the preview being applied. A plan replaced by a later preview, or a missing one, fails with 409.
          allOf:
            - $ref: '#/components/schemas/ServerId'
        answers: { $ref: '#/components/schemas/RecordAnswers' }
        saveTemplate:
          type: object
          description: Save the template, with the answers' value maps and date order, under this ID and name.
          required: [id, name]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string, minLength: 1 }
    RecordsApplied:
      type: object
      required: [snapshotId, counts]
      properties:
        snapshotId: { $ref: '#/components/schemas/ServerId' }
        counts: { $ref: '#/components/schemas/RecordCounts' }
        templateId:
          description: The template saved with the answers, when one was requested.
          allOf:
            - $ref: '#/components/schemas/Id'
    RecordsSampleRequest:
      type: object
      required: [recordType, bucketBy, period]
      properties:
        recordType: { $ref: '#/components/schemas/Key' }
        where: { type: string }
        bucketBy:
          type: string
          description: A date field or date attribute key.
        period: { $ref: '#/components/schemas/Period' }
    RecordsSample:
      type: object
      required: [total, bySubject]
      properties:
        total: { type: integer, minimum: 0 }
        bySubject:
          type: array
          items:
            type: object
            required: [subjectId, name, count]
            properties:
              subjectId: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              count: { type: integer, minimum: 0 }
    ContributionMeasure:
      type: object
      description: |
        One derived measure of a metric cell. `value` and `source` are the
        stored data point (null and empty when none is stored, as on a
        rolled-up subject); `recordsValue` is the value records give, rolled
        up over the leaf subjects listed (null when records give none, or
        the measure's org aggregation cannot be rolled up here). `cutoff` is
        the last day records cover; `pending` counts commitments still due.
        `total` counts all of the measure's contributions across pages;
        `records` holds this page's contributions. `covered` is false when
        records give no value for any leaf subject listed (a month before
        the record type is tracked, after its latest snapshot, or subjects
        no records map to): the cell is then missing, not zero.
      required: [measureKey, value, source, recordsValue, pending, total, covered, records]
      properties:
        covered: { type: boolean }
        measureKey: { $ref: '#/components/schemas/Key' }
        value: { $ref: '#/components/schemas/MeasureValue' }
        source: { type: string }
        recordsValue: { $ref: '#/components/schemas/MeasureValue' }
        cutoff: { $ref: '#/components/schemas/Date' }
        pending: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        records:
          type: array
          items: { $ref: '#/components/schemas/RecordContribution' }
    RecordContributions:
      type: object
      required: [measures]
      properties:
        measures:
          type: array
          items: { $ref: '#/components/schemas/ContributionMeasure' }
        nextCursor:
          type: string
          description: Absent on the last page.

    # ---- Layouts -----------------------------------------------------------
    LayoutItem:
      type: object
      required: [id, size, hidden]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9:_-]{0,80}$'
        size:
          type: string
          enum: [small, wide]
        hidden:
          type: boolean
    PutLayoutRequest:
      type: object
      required: [items, expectedRevision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LayoutItem' }
        expectedRevision:
          type: integer
          minimum: 0
    LayoutResponse:
      type: object
      required: [items, revision, source, defaultRevision]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LayoutItem' }
        revision:
          type: integer
        source:
          type: string
          enum: [user, default, empty]
        defaultRevision:
          type: integer
          minimum: 0

    ReportSummary:
      type: object
      required: [text, revision]
      properties:
        text: { type: string }
        revision: { type: integer, minimum: 0 }
        updatedBy: { $ref: '#/components/schemas/UserId' }
        updatedAt: { type: string, format: date-time }
    PutReportSummaryRequest:
      type: object
      required: [text, expectedRevision]
      properties:
        text: { type: string }
        expectedRevision: { type: integer, minimum: 0 }
    ReportMonthList:
      type: object
      required: [months]
      properties:
        months:
          type: array
          items: { $ref: '#/components/schemas/ReportMonth' }
    ReportMonth:
      type: object
      required: [period, status, revision]
      properties:
        period: { $ref: '#/components/schemas/MonthPeriod' }
        status:
          type: string
          enum: [live, published]
        publishedAt:
          type: string
          format: date-time
          nullable: true
        publishedBy:
          allOf: [{ $ref: '#/components/schemas/UserId' }]
          nullable: true
        revision:
          type: integer
          minimum: 0
          description: Latest published revision; 0 when live.
    PublishReportRequest:
      type: object
      properties:
        summary:
          type: string
          description: Optional summary text; when omitted the stored summary is used.
    PublishReportResponse:
      type: object
      required: [revision, unlocked]
      properties:
        revision: { type: integer, minimum: 1 }
        unlocked: { type: boolean }
    ReportChange:
      type: object
      required: [metricKey, subjectId, period, was, now]
      properties:
        metricKey: { $ref: '#/components/schemas/Key' }
        subjectId: { $ref: '#/components/schemas/Id' }
        period: { $ref: '#/components/schemas/Period' }
        was: { type: string }
        now: { type: string }
    ReportDocument:
      type: object
      required: [live, revision, dataRevised, changes, summary, facts, view, generatedAt, summaryScope]
      properties:
        live: { type: boolean }
        revision: { type: integer, minimum: 0 }
        dataRevised: { type: boolean }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ReportChange' }
        summary: { type: string }
        facts:
          type: array
          items: { type: string }
        view: { $ref: '#/components/schemas/ScorecardView' }
        generatedAt: { type: string, format: date-time }
        summaryScope:
          type: string
          enum: [company]

    # ---- Audit ------------------------------------------------------------
    AuditEntry:
      type: object
      required: [id, actorId, channel, action, targetType, targetId, at]
      properties:
        id: { $ref: '#/components/schemas/ServerId' }
        actorId: { type: string }
        channel: { type: string, example: api }
        action: { type: string, example: update }
        targetType: { type: string, example: org_unit }
        targetId: { type: string }
        before:
          description: JSON of the target before the change; absent when it did not exist.
        after:
          description: JSON of the target after the change; absent when it was removed.
        at: { type: string, format: date-time }
